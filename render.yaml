services:
  - type: web
    name: krynx-video-vault
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm --prefix server ci && npm --prefix client ci && npm --prefix client run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: TOKEN_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
